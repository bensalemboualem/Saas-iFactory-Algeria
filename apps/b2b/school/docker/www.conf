; ===========================================
; PHP-FPM Performance Configuration for OnestSchool
; ===========================================

; Use ondemand for Docker to save memory when idle
pm = ondemand

; Maximum number of child processes
pm.max_children = 20

; Number of seconds after which an idle process will be killed
pm.process_idle_timeout = 10s

; Maximum requests per child before respawning (prevents memory leaks)
pm.max_requests = 500

; Request timeout (prevents hanging requests)
request_terminate_timeout = 60s

; Slow log for debugging slow requests
slowlog = /var/log/php-fpm-slow.log
request_slowlog_timeout = 5s

; Security - limit extensions
security.limit_extensions = .php

; Error logging
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php-fpm-error.log
