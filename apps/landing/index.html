<!doctype html>
<html lang="fr" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IAFactory Algeria - Plateforme IA Souveraine</title>
  <meta name="description" content="Plateforme IA souveraine pour l'Algérie. Applications intelligentes, agents IA et workflows automatisés.">

  <!-- Police Cairo pour l'arabe -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    // Initialize theme from localStorage before React loads (prevents flash)
    (function() {
      var theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
