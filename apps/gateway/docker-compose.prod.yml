# IAFactory Gateway - Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
# 1. Copy .env.example to .env and fill in values
# 2. Update Caddyfile with your domain
# 3. Run migrations: docker compose -f docker-compose.prod.yml exec gateway pnpm prisma migrate deploy

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iafactory-gateway
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-iafactory}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-iafactory}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - BILLING_MODE=${BILLING_MODE:-beta}
      - BETA_SIGNUP_CREDITS=${BETA_SIGNUP_CREDITS:-5.0}
      - BETA_DAILY_LIMIT=${BETA_DAILY_LIMIT:-2.0}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - ADMIN_ALLOWED_IPS=${ADMIN_ALLOWED_IPS:-127.0.0.1,::1,172.18.0.0/16}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_PRETTY=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - iafactory-internal

  postgres:
    image: postgres:16-alpine
    container_name: iafactory-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-iafactory}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-iafactory}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iafactory}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iafactory-internal

  redis:
    image: redis:7-alpine
    container_name: iafactory-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iafactory-internal

  caddy:
    image: caddy:2-alpine
    container_name: iafactory-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - iafactory-internal
      - iafactory-external

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  iafactory-internal:
    driver: bridge
    internal: true
  iafactory-external:
    driver: bridge
