name: dzir-ia-prod

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dzir-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: dzir-minio
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # Optionnel: LLM local (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: dzir-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    profiles: [ "local-llm" ]

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: dzir-backend
    env_file:
      - ../../backend/.env
    environment:
      NODE_ENV: production
      PORT: "4000"

      # Auth (mets false en prod si tu actives auth)
      AUTH_BYPASS: "true"
      AUTH_BYPASS_USER_ID: dev-user-001

      # Internal service URLs (docker network)
      QDRANT_URL: http://qdrant:6333

      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: dzir-files

      SQLITE_PATH: /app/data/dzir.db

      # LLM local (si profil local-llm activé)
      LOCAL_LLM_BASE_URL: http://ollama:11434/v1
      LOCAL_LLM_MODEL: llama3.2:3b
    volumes:
      - ../../backend/data:/app/data
    depends_on:
      - qdrant
      - minio
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: dzir-frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: dzir-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Certbot webroot + certificats
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: dzir-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    restart: unless-stopped

volumes:
  qdrant_data:
  minio_data:
  ollama_data:
