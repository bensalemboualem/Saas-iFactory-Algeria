services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dzir-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: dzir-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # ✅ Ollama (Local LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: dzir-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: dzir-backend
    ports:
      - "4000:4000"
    volumes:
      - ../backend/data:/app/data
    env_file:
      - ../backend/.env
    environment:
      PORT: "4000"
      NODE_ENV: development

      AUTH_BYPASS: "true"
      AUTH_BYPASS_USER_ID: dev-user-001

      QDRANT_URL: http://qdrant:6333

      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: dzir-ia

      SQLITE_PATH: /app/data/dzir.db
      GATEWAY_URL: http://host.docker.internal:3000
    depends_on:
      - qdrant
      - minio
      - ollama
    restart: unless-stopped

volumes:
  qdrant_data:
  minio_data:
  # ✅ Ollama models cache (persist)
  ollama_data:
